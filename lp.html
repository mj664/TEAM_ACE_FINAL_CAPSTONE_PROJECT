<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign in - DRRMC Caloocan Hub</title>
  <link rel="icon" type="image/jpeg" href="assets/cdrrmd-logo.jpg">
<link rel="apple-touch-icon" href="assets/cdrrmd-logo.jpg">
  <link rel="stylesheet" href="assets/style.css?v=1789912783">
  <style>.drrmc-loader:not(.active) { display:none; }</style>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    .login-shell { display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
    .login-card { width:100%; max-width:440px; background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.12); border:1px solid #e9ecef; padding:38px 34px 30px; text-align:center; }
    .login-logo { width:104px; height:104px; border-radius:50%; object-fit:cover; border:3px solid #fff; box-shadow:0 0 0 3px rgba(45,122,92,.25), 0 12px 24px rgba(30,77,55,.3); margin-bottom:16px; }
    .login-card h1 { margin:0 0 4px; font-size:24px; color:var(--primary); }
    .login-card .tagline { margin:0 0 26px; color:#667085; font-size:13px; line-height:1.5; }
    .google-btn { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:13px 16px; border:1px solid #d0d5dd; border-radius:10px; background:#fff; color:#344054; font-size:15px; font-weight:700; text-decoration:none; cursor:pointer; transition:box-shadow .2s, background .2s; }
    .google-btn:hover { background:#f9fafb; box-shadow:0 2px 8px rgba(16,24,40,.12); text-decoration:none; color:#1f2937; }
    .google-btn svg { width:22px; height:22px; flex:0 0 auto; }
    .login-note { margin:18px 0 0; font-size:12px; color:#667085; line-height:1.6; }
    .setup-box { margin-top:22px; padding:14px 16px; border:1px dashed #f59e0b; background:#fffbeb; border-radius:10px; text-align:left; font-size:12px; color:#92400e; line-height:1.6; }
    .setup-box code { display:block; margin:6px 0; padding:6px 8px; background:#fff; border:1px solid #fde68a; border-radius:6px; color:#1f2937; word-break:break-all; user-select:all; }
    .setup-box form { margin-top:10px; display:grid; gap:8px; }
    .setup-box input { width:100%; padding:10px 12px; border:1px solid #d9dfe7; border-radius:8px; font-size:13px; }
  </style>
</head>
<body class="auth-page">
<div class="login-shell">
  <div class="login-card">
    <img class="login-logo" src="assets/cdrrmd-logo.jpg" alt="DRRMC Caloocan logo">
    <h1>DRRMC Caloocan Hub</h1>
    <p class="tagline">Disaster Risk Reduction &amp; Management Inventory System<br>South Caloocan City</p>

    
    <a class="google-btn" id="googleSignIn" href="google_login.php">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </a>
    <p class="login-note">Only registered, approved accounts can sign in. New staff: sign in with Google and you will be taken to registration.</p>

      </div>
</div>

<div class="drrmc-loader" id="drrmcLoader" role="status" aria-live="polite">
  <div class="drrmc-loader-logo"><img src="assets/cdrrmd-logo.jpg" alt=""></div>
  <div class="drrmc-loader-text">Verifying your account&hellip;</div>
</div>
<script>
  (function () {
    var loader = document.getElementById('drrmcLoader');
    function showLoader() { loader.classList.add('active'); }
    document.getElementById('googleSignIn').addEventListener('click', showLoader);
    document.querySelectorAll('form').forEach(function (f) { f.addEventListener('submit', showLoader); });
    window.addEventListener('pageshow', function (e) { if (e.persisted) loader.classList.remove('active'); });
  })();
</script>
</body>
</html>
